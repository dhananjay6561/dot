name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs always finish, so the badge never shows a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only set on pushes to this repo; pull requests from forks build unsigned with the test Glyph key.
      DOT_KEYSTORE_BASE64: ${{ secrets.DOT_KEYSTORE_BASE64 }}
      DOT_KEYSTORE_PASSWORD: ${{ secrets.DOT_KEYSTORE_PASSWORD }}
      DOT_KEY_ALIAS: ${{ secrets.DOT_KEY_ALIAS }}
      DOT_KEY_PASSWORD: ${{ secrets.DOT_KEY_PASSWORD }}
      NOTHING_API_KEY: ${{ secrets.NOTHING_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare release signing
        if: env.DOT_KEYSTORE_BASE64 != ''
        run: |
          echo "$DOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dot-release.jks"
          echo "DOT_KEYSTORE=$RUNNER_TEMP/dot-release.jks" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/tests/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dot-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
